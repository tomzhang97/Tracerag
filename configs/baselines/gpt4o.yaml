name: gpt4o
type: baseline
task: docvqa

answerer:
  provider: openai
  model_name: gpt-4o
  api_key: "${OPENAI_API_KEY}"
  temperature: 0.0
  max_tokens: 1024
  claim_extraction:
    enabled: false          # GPT-4o used as a simple reader, no claim extraction

eval:
  metrics: [answer_em, answer_f1]
  tasks: [docvqa, microtext]

notes: >
  GPT-4o used as a closed-source VLM upper-bound reference.  Not part of the
  main shared-answerer retrieval stack; used for sanity-checking only.
