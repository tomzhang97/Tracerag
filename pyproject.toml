[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracerag"
version = "0.1.0"
description = "TraceRAG: Vector-Native, Revision-Aware, and Layout-Linked Multimodal Retrieval for Technical Documents"
authors = [
    {name = "TraceRAG Team"}
]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["RAG", "multimodal", "technical-documents", "vector-native", "revision-aware"]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "accelerate>=0.24.0",
    "PyMuPDF>=1.23.0",
    "pdfplumber>=0.10.0",
    "Pillow>=10.0.0",
    "shapely>=2.0.0",
    "Rtree>=1.1.0",
    "networkx>=3.1",
    "faiss-cpu>=1.7.4",
    "pydantic>=2.5.0",
    "PyYAML>=6.0",
    "loguru>=0.7.0",
    "typer>=0.9.0",
    "rank-bm25>=0.2.2",
    "tqdm>=4.66.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

# Baseline-specific extras (install as needed):
#   pip install -e ".[ocr]"         — Tesseract + PaddleOCR
#   pip install -e ".[vision]"      — ColPali / ColQwen2
#   pip install -e ".[vlm]"         — Qwen2.5-VL
#   pip install -e ".[baselines]"   — all of the above
ocr = [
    "pytesseract>=0.3.10",          # Tesseract Python wrapper (needs Tesseract binary)
    "paddleocr>=2.7.0",             # PP-OCRv5
    "paddlepaddle>=2.6.0",          # PaddlePaddle CPU runtime
    "editdistance>=0.6.3",          # CER metric in baseline runner
]
vision = [
    "colpali-engine>=0.3.0",        # ColPali / ColQwen2 loaders + processors
]
vlm = [
    "transformers>=4.45.0",         # Qwen2.5-VL requires ≥4.45
    "qwen-vl-utils>=0.0.6",         # process_vision_info helper
]
baselines = [
    "pytesseract>=0.3.10",
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.6.0",
    "colpali-engine>=0.3.0",
    "transformers>=4.45.0",
    "qwen-vl-utils>=0.0.6",
    "editdistance>=0.6.3",
    "scipy>=1.11.0",                # connected-component labelling in AbsDiff
]

[project.scripts]
tracerag-ingest = "tracerag.cli.ingest_pdf:main"
tracerag-build-index = "tracerag.cli.build_index:main"
tracerag-search = "tracerag.cli.demo_search:main"
tracerag-chat = "tracerag.cli.chat_raw:main"
tracerag-eval = "tracerag.cli.run_eval:main"
tracerag-docvqa-prepare = "tracerag.cli.prepare_docvqa:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tracerag*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
