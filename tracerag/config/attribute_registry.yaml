diameter:
  aliases: ["直径", "绳径", "Φ", "φ", "dia", "diameter"]
  answer_type: "numeric_with_unit"
  allowed_units: ["mm"]
  regex_hints:
    - "(?i)[Φφ]\\s*\\d+(?:\\.\\d+)?"
    - "(?i)\\d+(?:\\.\\d+)?\\s*mm\\b"
  normalization_rules: ["normalize_fullwidth", "normalize_phi_prefix", "normalize_unit_spacing", "lowercase"]

gross_weight:
  aliases: ["总毛重", "毛重", "gross weight"]
  answer_type: "numeric_with_unit"
  allowed_units: ["kg"]
  regex_hints:
    - "(?i)\\d+(?:\\.\\d+)?\\s*kg\\b"
  normalization_rules: ["normalize_fullwidth", "normalize_unit_spacing", "lowercase"]

net_weight:
  aliases: ["净重", "总净重", "net weight"]
  answer_type: "numeric_with_unit"
  allowed_units: ["kg"]
  regex_hints:
    - "(?i)\\d+(?:\\.\\d+)?\\s*kg\\b"
  normalization_rules: ["normalize_fullwidth", "normalize_unit_spacing", "lowercase"]

speed:
  aliases: ["速度", "speed"]
  answer_type: "numeric_with_unit"
  allowed_units: ["m/s", "mps"]
  regex_hints:
    - "(?i)\\d+(?:\\.\\d+)?\\s*(?:m/s|mps)\\b"
  normalization_rules: ["normalize_fullwidth", "normalize_unit_spacing", "lowercase"]

voltage:
  aliases: ["电压", "伏", "voltage"]
  answer_type: "numeric_with_unit"
  allowed_units: ["v", "kv"]
  regex_hints:
    - "(?i)\\d+(?:\\.\\d+)?\\s*(?:kv|v)\\b"
  normalization_rules: ["normalize_fullwidth", "normalize_unit_spacing", "lowercase"]

capacity:
  aliases: ["载重量", "容量", "capacity"]
  answer_type: "numeric_with_unit"
  allowed_units: ["kg"]
  regex_hints:
    - "(?i)\\d+(?:\\.\\d+)?\\s*kg\\b"
  normalization_rules: ["normalize_fullwidth", "normalize_unit_spacing", "lowercase"]

quantity:
  aliases: ["数量", "台数", "件数", "qty", "quantity"]
  answer_type: "numeric_plain"
  allowed_units: []
  regex_hints:
    - "(?i)\\b\\d+(?:\\.\\d+)?\\b"
  normalization_rules: ["normalize_fullwidth", "strip_commas"]

temperature_range:
  aliases: ["温度范围", "工作温度", "温度区间", "temperature range"]
  answer_type: "range_with_unit"
  allowed_units: ["°c", "c", "℃"]
  regex_hints:
    - "(?i)-?\\d+(?:\\.\\d+)?\\s*(?:to|[-~至])\\s*-?\\d+(?:\\.\\d+)?\\s*(?:°c|℃|c)\\b"
  normalization_rules: ["normalize_fullwidth", "normalize_range_dash", "normalize_unit_spacing", "lowercase"]

model_number:
  aliases: ["型号", "model", "model no", "model number"]
  answer_type: "identifier"
  allowed_units: []
  regex_hints:
    - "(?i)\\b[A-Z0-9]+(?:[-_/][A-Z0-9]+)+\\b"
  normalization_rules: ["normalize_fullwidth", "uppercase", "strip_spaces"]

revision_date:
  aliases: ["日期", "修订日期", "版本日期", "revision date", "issue date", "date"]
  answer_type: "date"
  allowed_units: []
  regex_hints:
    - "\\b\\d{4}[-/.]\\d{1,2}[-/.]\\d{1,2}\\b"
    - "\\b\\d{4}年\\d{1,2}月\\d{1,2}日\\b"
  normalization_rules: ["normalize_fullwidth", "iso_date"]

status:
  aliases: ["状态", "结论", "status", "result"]
  answer_type: "enum"
  allowed_units: []
  regex_hints:
    - "(?i)pass"
    - "(?i)fail"
    - "(?i)approved"
    - "(?i)rejected"
    - "合格"
    - "不合格"
    - "通过"
    - "未通过"
  normalization_rules: ["normalize_fullwidth", "lowercase", "collapse_spaces"]

certificate_number:
  aliases: ["证书编号", "证书号", "certificate no", "certificate number"]
  answer_type: "certificate_id"
  allowed_units: []
  regex_hints:
    - "(?i)\\b(?:TSXF|TS|CERT)[A-Z0-9-]{6,}\\b"
    - "(?i)\\b[A-Z0-9]{2,}(?:[-/][A-Z0-9]{2,}){1,}\\b"
  normalization_rules: ["normalize_fullwidth", "uppercase", "strip_spaces"]

report_number:
  aliases: ["报告编号", "报告号", "report no", "report number"]
  answer_type: "doc_id"
  allowed_units: []
  regex_hints:
    - "(?i)\\b(?:REP|RPT)[A-Z0-9-]{4,}\\b"
    - "(?i)\\b[A-Z0-9]{2,}(?:[-/][A-Z0-9]{2,}){1,}\\b"
  normalization_rules: ["normalize_fullwidth", "uppercase", "strip_spaces"]

contract_number:
  aliases: ["合同号", "合同编号", "contract no", "contract number"]
  answer_type: "doc_id"
  allowed_units: []
  regex_hints:
    - "(?i)\\b[A-Z0-9]{2,}(?:[-/][A-Z0-9]{2,}){1,}\\b"
  normalization_rules: ["normalize_fullwidth", "uppercase", "strip_spaces"]
